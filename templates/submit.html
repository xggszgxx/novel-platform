{% extends "base.html" %}
{% block title %}投稿{% endblock %}
{% block content %}
<h2>投稿</h2>
<form method="post">
  {{ form.hidden_tag() }}
  <p>{{ form.title.label }}<br>{{ form.title() }}</p>
  <p>{{ form.intro.label }}<br>{{ form.intro(rows=3) }}</p>
  <p>{{ form.content.label }}<br>{{ form.content(rows=12) }}</p>
  <p>{{ form.submit() }}</p>
</form>
{% endblock %}
