 {% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<h2>注册</h2>
<form method="post">
  {{ form.hidden_tag() }}
  <p>{{ form.username.label }}<br>{{ form.username() }}</p>
  <p>{{ form.password.label }}<br>{{ form.password() }}</p>
  <p>{{ form.confirm.label }}<br>{{ form.confirm() }}</p>
  <p>{{ form.submit() }}</p>
</form>
{% endblock %}
